# /etc/nginx/sites-available/agent.maxima-consulting.ru
# Frontend: статика из dist/, API: proxy на uvicorn :8001

server {
    listen 80;
    server_name agent.maxima-consulting.ru;

    root /var/www/mc-agent/web/frontend/dist;
    index index.html;

    # SPA — все маршруты отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # Кэш статики
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
